# The community launcher deliberately prefers DSH's in-page directory browser
# on Windows.  The stock auto picker opens a separate native window, which can
# remain behind the browser on some Windows desktops.  This file is the single
# true source for the launcher's plugin roster: at startup the launcher merges
# it into the web profile's own cordis.patch.yml (watched by Cordis HMR), so
# plugin changes hot-reload without restarting the service.
- id: directory-picker
  disabled: true

- insert:
    - id: directory-picker-browse-host
      name: '@deepseek-ai/dsh-host-directory-picker-browse'

    - id: directory-picker-browse-client
      name: '@dsh-community/dsh-client-ui-drive-picker'

    - id: file-explorer
      name: dsh-file-explorer

    - id: dsh-chat-outline
      name: dsh-chat-outline

    - id: cost-meter
      name: '@steven-wu/dsh-cost-meter'

    - id: balance-tide
      name: 'dsh-balance-tide'

    - id: chameleon-session-delete
      name: '@huanlin/dsh-plugin-session-delete'

    - id: dsh-ding
      name: 'dsh-ding'
