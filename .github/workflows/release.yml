name: Build portable ZIP

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    env:
      POWERSHELL_TELEMETRY_OPTOUT: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Build and verify portable ZIP
        shell: pwsh
        run: |
          ./scripts/build-portable-zip.ps1
          ./scripts/verify-runtime.ps1
          ./scripts/smoke-web.ps1
          ./artifacts/portable/DeepSeekHarness/runtime/node/node.exe ./tests/launcher-core-test.mjs
          ./tests/launcher-integration.ps1
          ./tests/portable-zip-test.ps1
          ./tests/portable-zip-e2e.ps1

      - name: Upload ZIP build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeekHarness-Portable
          path: |
            artifacts/dist/DeepSeekHarness-Portable-*.zip
            artifacts/dist/DeepSeekHarness-Portable-*.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem artifacts/dist/DeepSeekHarness-Portable-*.zip* | Select-Object -ExpandProperty FullName
          if ($assets.Count -ne 2) {
            throw "Expected exactly one ZIP and one SHA-256 file, found $($assets.Count) release assets."
          }
          gh release create $env:GITHUB_REF_NAME @assets --generate-notes --verify-tag
